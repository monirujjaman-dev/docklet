name: Release

# Tag vX.Y.Z -> GitHub release with linux/amd64 + linux/arm64 binaries and
# checksums.txt (used by `docklet upgrade`). The container image for the same
# tag is published by image.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - name: Build binaries and checksums
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Check binaries
        run: |
          for a in amd64 arm64; do
            size=$(stat -c %s "bin/docklet-linux-$a")
            echo "docklet-linux-$a: $((size / 1024 / 1024)) MB"
            test "$size" -le $((40 * 1024 * 1024))
          done
          ./bin/docklet-linux-amd64 version | grep -F "${GITHUB_REF_NAME}"
          cat bin/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          notes=""
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            notes="--notes-file docs/releases/${GITHUB_REF_NAME}.md"
          else
            notes="--generate-notes"
          fi
          gh release create "${GITHUB_REF_NAME}" --title "Docklet ${GITHUB_REF_NAME}" $flags $notes \
            bin/docklet-linux-amd64 bin/docklet-linux-arm64 bin/checksums.txt
