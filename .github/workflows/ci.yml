name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - name: Build linux/${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make build-go
      - name: Check binary size budget (<= 40 MB)
        run: |
          size=$(stat -c %s bin/docklet)
          echo "binary size: $((size / 1024 / 1024)) MB"
          test "$size" -le $((40 * 1024 * 1024))
      - uses: actions/upload-artifact@v4
        with:
          name: docklet-linux-${{ matrix.arch }}
          path: bin/docklet

  docker:
    # Validates the Dockerfile on every PR (images are published by image.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docklet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm docklet:ci version
          docker run -d --name d -p 3000:3000 -e DOCKLET_CADDY_ADMIN=off -e DOCKLET_DOCKER_SOCKET=off docklet:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs d; exit 1
